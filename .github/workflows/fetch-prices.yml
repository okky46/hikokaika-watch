name: Fetch daily prices

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: fetch-daily-prices
  cancel-in-progress: false

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r scripts/fetch_prices/requirements.txt
      - name: Fetch daily closes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: python scripts/fetch_prices/fetch_prices.py
