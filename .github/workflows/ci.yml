name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/collect/requirements.txt
      - run: python -m unittest discover -s scripts/collect -p 'test_*.py'
      - run: DEPLOY_ENV=test DATA_SOURCE=sample npm run build
